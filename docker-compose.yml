services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: imageservice
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: imageservice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imageservice -d imageservice"]
      interval: 2s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console at http://localhost:9001
    volumes:
      - miniodata:/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: imageservice
      POSTGRES_PWD: secret
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8088
    ports:
      - "8088:8080" # Temporal Web UI on http://localhost:8088 
    depends_on:
      - temporal

  imageservice:
    build:
      context: .
      dockerfile: Dockerfile.imageservice

  authservice:
    build:
      context: .
      dockerfile: Dockerfile.authservice
    environment:
      DATABASE_URL: postgres://imageservice:secret@postgres:5432/imageservice
      JWT_SECRET: dev-secret-change-me-in-prod # the secret lives ONLY here now
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      IMAGE_SERVICE_ADDR: imageservice:50051
      DATABASE_URL: postgres://imageservice:secret@postgres:5432/imageservice
    volumes:
      - uploads:/app/uploads
    restart: on-failure # retry until Temporal's frontend is ready
    deploy:
      replicas: 2 # two workers share the task queue
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      imageservice:
        condition: service_started

  httpserver:
    build:
      context: .
      dockerfile: Dockerfile.httpserver
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://imageservice:secret@postgres:5432/imageservice
      TEMPORAL_ADDRESS: temporal:7233
      AUTH_SERVICE_ADDR: authservice:50052
    volumes:
      - uploads:/app/uploads
    restart: on-failure # retry until Temporal's frontend is ready
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      authservice:
        condition: service_started

volumes:
  pgdata:
  uploads:
  miniodata:
