openapi: 3.0.3
info:
  title: go-image-service API
  version: 2.0.0
  description: |
    Upload images, resize them, and fetch versions by URL.

    Uploads are **presigned and asynchronous**. The client negotiates an upload with
    `POST /uploads`, PUTs the bytes directly to object storage against the returned URL
    (they never pass through this service), then signals completion with
    `POST /uploads/{id}/complete`. A Temporal workflow — started before any bytes exist —
    validates the object, fans out the resizes, and marks the upload complete. Poll
    `GET /images/{id}/status` until it reads `complete`.

    Status vocabulary: `pending` → `validating` → `processing` →
    `complete` | `failed` | `rejected` | `abandoned`.

    If the client never signals, a 15-minute timer fires and the upload is deleted and
    marked `abandoned`.
servers:
  - url: http://localhost:8080

paths:
  /health:                  # URL path
    get:                    # HTTP Method -> one "operation"
      summary: Liveness check
      responses:            # keyed by status code
        '200':
          description: Service is alive
          content:
            application/json: # the response content-type
              schema:         # shape of the body
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /uploads:
    post:
      summary: Negotiate an upload; returns a presigned URL for the client to PUT bytes to
      description: |
        Creates the `uploads` row (status `pending`), starts the Temporal workflow — which
        immediately blocks waiting for the completion signal — and returns a presigned PUT
        URL. No image bytes are sent to or handled by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - content_type
              properties:
                filename:
                  type: string
                  example: selfie.jpg
                content_type:
                  type: string
                  enum: ['image/jpeg', 'image/png']
                  example: image/jpeg
      responses:
        '201':
          description: Upload negotiated; PUT the bytes to `url` before it expires
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
                  url:
                    type: string
                    format: uri
                    description: Presigned PUT URL for the object key `{id}/original`
                    example: http://localhost:9000/images/a1b2.../original?X-Amz-Signature=...
                  expires_in:
                    type: integer
                    description: Lifetime of `url`, in seconds
                    example: 900
        '400':
          description: Missing or invalid `filename` / `content_type`
        '500':
          description: Server error while creating the record, starting the workflow, or presigning

  /uploads/{id}/complete:
    post:
      summary: Signal that the client has finished PUTting the bytes
      description: |
        Sends the `upload-complete` signal to the workflow, which unblocks and begins
        validation. **Idempotent:** calling it again after the workflow has already finished
        still returns `200` — the caller's intent was satisfied, just earlier. The same is
        true if the MinIO webhook signalled first; the duplicate signal is never read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Signal delivered, or the workflow had already completed
        '400':
          description: Malformed id
        '404':
          description: No upload exists for the given id
        '500':
          description: Server error while signalling the workflow

  /internal/s3-events:
    post:
      summary: MinIO `ObjectCreated` webhook (internal)
      description: |
        Server-side alternative to `POST /uploads/{id}/complete`, so an upload still
        progresses if the client PUTs the bytes and then disappears. Sends the same
        `upload-complete` signal. Not part of the public API — it should not be reachable
        from outside the cluster.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: MinIO bucket-notification event payload
      responses:
        '204':
          description: Event accepted
        '400':
          description: Unparseable event payload
        '500':
          description: Server error while signalling the workflow

  /images/{id}/status:
    get:
      summary: Poll the processing status of an upload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
                  status:
                    type: string
                    enum:
                      - pending
                      - validating
                      - processing
                      - complete
                      - failed
                      - rejected
                      - abandoned
        '400':
          description: Malformed id
        '404':
          description: No upload exists for the given id
        '500':
          description: Server error

  /images/{id}:
    get:
      summary: Get uploaded image by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: true
          schema:
            type: string
            enum: ['original', '12x12', '25x25'] # only allows these sizes
      responses:
        '200':
          description: Request ok
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
        '404':
          description: Request not found

  /upload:
    post:
      deprecated: true
      summary: "[Removed in v2] Multipart upload"
      description: |
        Replaced by the presigned flow: `POST /uploads` → client PUT →
        `POST /uploads/{id}/complete`. Kept here only to document the break; it is not
        served alongside the new flow.
      requestBody:
        required: true
        content:
          multipart/form-data:      # a file upload
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary     # the uploaded file bytes
      responses:
        '202':
          description: Image accepted; resizing continues in the background
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
        '400':
          description: No file provided, or unsupported file type (JPEG/PNG only)
        '413':
          description: File exceeds the 10 MB limit
        '500':
          description: Server error while storing or resizing
